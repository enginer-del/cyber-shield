<!DOCTYPE html><html><head><meta charset="UTF-8"></head><html lang='ar' dir='rtl'><meta name='viewport' content='width=device-width,initial-scale=1'><title>CYBER SHIELD</title><body style='background:#080306;color:#fff;font-family:Arial;text-align:center;padding:25px'><h1 style='color:#ff2638'>🛡️ CYBER SHIELD</h1><h3>فحص المهندس</h3><p>نظام تحليل الملفات الأمني</p><hr><h3>اختر ملفاً للفحص</h3><input type='file' id='file'><p id='result'>بانتظار اختيار الملف</p><button onclick='scan()' style='background:#d90020;color:white;box-shadow:0 0 18px #ff2638;padding:14px;border:0;border-radius:10px;font-size:17px'>ابدأ الفحص</button><script>async function scan(){let f=document.getElementById('file').files[0];let r=document.getElementById('result');if(!f){r.textContent='اختار ملف أولاً';return}let b=await f.arrayBuffer();let h=await crypto.subtle.digest('SHA-256',b);let hash=Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');r.innerHTML='اسم الملف: '+f.name+'<br>الحجم: '+f.size+' بايت<br>SHA-256: '+hash+'<br>تم جمع المعلومات. هذا ليس حكماً على سلامة الملف.'}</script></body></html>
